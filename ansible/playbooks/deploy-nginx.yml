- name: Deploy Nginx to Web Servers
  hosts: webservers
  become: true

  tasks:

    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy custom homepage
      template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html
      notify:
        - Restart nginx

  handlers:

    - name: Restart nginx
      service:
        name: nginx
        state: restarted